name: Terraform Prod

on:
  # Run plan on pull requests
  pull_request:
    branches: [main]
    paths:
      - 'prod/**'
      - 'modules/**'
  # Run plan + apply when merged to main
  push:
    branches: [main]
    paths:
      - 'prod/**'
      - 'modules/**'
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Prevent overlapping runs from corrupting state
concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./prod
    env:
      # Akamai provider credentials
      AKAMAI_CLIENT_SECRET: ${{ secrets.AKAMAI_CLIENT_SECRET }}
      AKAMAI_HOST:          ${{ secrets.AKAMAI_HOST }}
      AKAMAI_ACCESS_TOKEN:  ${{ secrets.AKAMAI_ACCESS_TOKEN }}
      AKAMAI_CLIENT_TOKEN:  ${{ secrets.AKAMAI_CLIENT_TOKEN }}
      AKAMAI_ACCOUNT_KEY:  ${{ secrets.AKAMAI_ACCOUNT_KEY }}
      # S3 backend (Linode Object Storage) credentials
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init - reconfigure

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      # Apply only on push to main (not on pull requests)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false tfplan